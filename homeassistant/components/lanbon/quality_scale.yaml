rules:
  # Bronze
  action-setup:
    status: done
    comment: Service registered in async_setup and kept registered across entry unload/reload.
  appropriate-polling:
    status: done
    comment: WebSocket push primary; 30s HTTP poll fallback.
  brands:
    status: done
    comment: https://github.com/home-assistant/brands/pull/10854
  common-modules:
    status: done
    comment: coordinator.py holds API client and DataUpdateCoordinator.
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: tests/components/lanbon/test_config_flow.py covers user and discovery success, recovery, and error paths.
  dependency-transparency:
    status: done
    comment: No third-party PyPI dependency; uses aiohttp via Home Assistant.
  docs-actions:
    status: done
    comment: set_channel_name documented in home-assistant.io.
  docs-conditions:
    status: exempt
    comment: No conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: LanbonRuntimeData on ConfigEntry.runtime_data.
  test-before-configure:
    status: done
    comment: config_flow validates via GET /api/v1/info.
  test-before-setup:
    status: done
    comment: async_config_entry_first_refresh on setup.
  unique-config-entry:
    status: done
    comment: unique_id = host MAC.

  # Silver
  action-exceptions: todo
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: todo
  diagnostics: todo
  discovery: done
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency:
    status: exempt
    comment: No third-party async dependency; uses aiohttp from Home Assistant.
  inject-websession:
    status: done
    comment: Uses async_get_clientsession.
  strict-typing: todo
